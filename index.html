<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travlr - Photo Review</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1>Review your Travels</h1>
      <p>Upload a photo of your spot and leave your review below.</p>
    </header>

    <section class="form-section">
      <form id="review-form">
        <!-- Place Name -->
        <div class="form-group">
          <label for="spot-name">Spot Name</label>
          <input type="text" id="spot-name" name="spotName" placeholder="e.g., Cafe de Flore" required>
        </div>

        <!-- Upload Photo -->
        <div class="form-group">
          <label for="spot-image">Upload Photo</label>
          <input type="file" id="spot-image" name="spotImage" accept="image/*" required>
        </div>

        <!-- Image Preview -->
        <div id="image-preview-container" class="hidden">
          <img id="image-preview" alt="Preview of uploaded spot photo">
        </div>

        <!-- Text Review Box -->
        <div class="form-group">
          <label for="review-text">Your Review</label>
          <textarea id="review-text" name="reviewText" rows="4" placeholder="Write your review here..." required></textarea>
        </div>

        <button type="submit" id="submit-btn">Save Review</button>
      </form>

      <!-- Feedback -->
      <p id="save-status" role="status" aria-live="polite" class="hidden"></p>
    </section>

    <!-- Photo Feed -->
    <section class="reviews-section">
      <h2>Saved Photo Reviews</h2>
      <p id="empty-state">No photo reviews added yet.</p>
      <ul id="reviews-list" class="reviews-list"></ul>
    </section>
  </main>
</body>
</html>
